name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Stable and beta ship as two applications that install side by side, so every
  # identity the OS keys on has to differ between them. Derived once here and
  # consumed by all three build jobs; the Go side derives the same values from
  # the version string (see internal/appflavor).
  flavor:
    runs-on: ubuntu-latest
    outputs:
      is_beta: ${{ steps.f.outputs.is_beta }}
      prerelease: ${{ steps.f.outputs.is_beta }}
      app_name: ${{ steps.f.outputs.app_name }}
      bundle_id: ${{ steps.f.outputs.bundle_id }}
      url_scheme: ${{ steps.f.outputs.url_scheme }}
      icns: ${{ steps.f.outputs.icns }}
      ico: ${{ steps.f.outputs.ico }}
      exe_name: ${{ steps.f.outputs.exe_name }}
      numeric_version: ${{ steps.f.outputs.numeric_version }}
    steps:
      - id: f
        run: |
          TAG="${GITHUB_REF_NAME}"
          NUMERIC="${TAG#v}"; NUMERIC="${NUMERIC%%-*}"
          case "$NUMERIC" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $TAG is not vX.Y.Z[-suffix]"; exit 1 ;;
          esac
          if [ "$TAG" != "${TAG%%-*}" ]; then
            {
              echo "is_beta=true"
              echo "app_name=AlisHub Beta"
              echo "bundle_id=com.patrickweb.alishub.beta"
              echo "url_scheme=alishub-beta"
              echo "icns=build/darwin/icons-beta.icns"
              echo "ico=build/windows/icon-beta.ico"
              echo "exe_name=alis-hub-v3-beta.exe"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "is_beta=false"
              echo "app_name=AlisHub"
              echo "bundle_id=com.patrickweb.alishub"
              echo "url_scheme=alishub"
              echo "icns=build/darwin/icons.icns"
              echo "ico=build/windows/icon.ico"
              echo "exe_name=alis-hub-v3.exe"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "numeric_version=$NUMERIC" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: flavor
    runs-on: macos-latest
    env:
      APP: ${{ needs.flavor.outputs.app_name }}.app
      APP_NAME: ${{ needs.flavor.outputs.app_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74
      - name: Install frontend deps
        run: npm --prefix frontend install
      - name: Generate bindings
        # -ts must match build/Taskfile.yml and the bindings checked into
        # frontend/bindings. Without it wails emits .js with JSDoc types, which
        # tsc widens (map values become {} instead of string) and the frontend
        # build fails on code that typechecks fine locally.
        run: wails3 generate bindings -clean=true -ts
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          # Install Apple WWDR intermediate certificates (required for valid chain)
          curl -sL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o /tmp/DevIDG2.cer
          security import /tmp/DevIDG2.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/WWDRG3.cer
          security import /tmp/WWDRG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true

          security import /tmp/certificate.p12 -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Verify
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          rm /tmp/certificate.p12 /tmp/DevIDG2.cer /tmp/WWDRG3.cer
      - name: Build binary
        run: go build -tags production,devtools -trimpath -ldflags="-w -s -X main.version=${{ github.ref_name }}" -o alis-hub-v3 .
        env:
          GOOS: darwin
      - name: Create .app bundle and sign
        run: |
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp alis-hub-v3 "$APP/Contents/MacOS/"
          # CFBundleIconFile stays "icons"; only the artwork differs per flavor.
          cp "${{ needs.flavor.outputs.icns }}" "$APP/Contents/Resources/icons.icns"
          cp build/darwin/Info.plist "$APP/Contents/Info.plist"
          # CFBundleShortVersionString is the user-facing marketing version and
          # Apple expects it numeric, so drop any -beta.N suffix there. The full
          # tag stays in CFBundleVersion.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.ref_name }}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.flavor.outputs.numeric_version }}" "$APP/Contents/Info.plist"
          # Distinct bundle identity, or macOS treats the two installs as one
          # app and resolves deep links to an arbitrary one of them.
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${{ needs.flavor.outputs.bundle_id }}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLName ${{ needs.flavor.outputs.bundle_id }}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 ${{ needs.flavor.outputs.url_scheme }}" "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          # Try Developer ID signing; fall back to ad-hoc if cert unavailable
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/' || true)
          if [ -n "$IDENTITY" ]; then
            echo "Signing with: $IDENTITY"
            # Strip Go's auto ad-hoc signature before re-signing.
            codesign --remove-signature "$APP/Contents/MacOS/alis-hub-v3" || true
            # Sign inner binary with entitlements + hardened runtime + timestamp (required for notarization).
            codesign --force --sign "$IDENTITY" --options runtime --timestamp \
              --entitlements build/darwin/entitlements.plist \
              "$APP/Contents/MacOS/alis-hub-v3"
            codesign --force --sign "$IDENTITY" --options runtime --timestamp \
              "$APP"
            codesign --verify --strict --verbose=2 "$APP"
          else
            echo "No Developer ID found, using ad-hoc signing"
            codesign --force --deep --sign - --entitlements build/darwin/entitlements.plist "$APP"
          fi
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::warning::Notarization secrets missing; skipping notarization. Downloaded app will be blocked by Gatekeeper."
            exit 0
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" /tmp/AlisHub-notarize.zip
          # Capture submission ID so we can fetch Apple's log on failure
          SUBMIT_OUT=$(xcrun notarytool submit /tmp/AlisHub-notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait 2>&1) || NOTARIZE_FAILED=1
          echo "$SUBMIT_OUT"
          SUBMIT_ID=$(echo "$SUBMIT_OUT" | awk '/^  id: / {print $2; exit}')
          if [ -n "$NOTARIZE_FAILED" ] || echo "$SUBMIT_OUT" | grep -q "status: Invalid"; then
            echo "::error::Notarization failed. Fetching Apple's log..."
            if [ -n "$SUBMIT_ID" ]; then
              xcrun notarytool log "$SUBMIT_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD"
            fi
            exit 1
          fi
          xcrun stapler staple "$APP"
          spctl -a -vvv -t execute "$APP" || true
          rm /tmp/AlisHub-notarize.zip
      - name: Create zip + DMG with Applications shortcut
        run: |
          VERSION=${{ github.ref_name }}
          ditto -c -k --sequesterRsrc --keepParent "$APP" "AlisHub-macOS-${VERSION}.zip"

          hdiutil create -size 200m -volname "$APP_NAME" -fs HFS+ -ov /tmp/alishub-rw.dmg
          hdiutil attach /tmp/alishub-rw.dmg -mountpoint /tmp/alishub-mount
          cp -R "$APP" /tmp/alishub-mount/
          ln -s /Applications /tmp/alishub-mount/Applications
          hdiutil detach /tmp/alishub-mount
          hdiutil convert /tmp/alishub-rw.dmg -format UDZO -o "AlisHub-macOS-${VERSION}.dmg"
          rm /tmp/alishub-rw.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: |
            AlisHub-macOS-*.zip
            AlisHub-macOS-*.dmg

  build-linux:
    needs: flavor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74
      - name: Install frontend deps
        run: npm --prefix frontend install
      - name: Generate bindings
        # -ts must match build/Taskfile.yml and the bindings checked into
        # frontend/bindings. Without it wails emits .js with JSDoc types, which
        # tsc widens (map values become {} instead of string) and the frontend
        # build fails on code that typechecks fine locally.
        run: wails3 generate bindings -clean=true -ts
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build binary
        run: go build -tags production -trimpath -ldflags="-w -s -X main.version=${{ github.ref_name }}" -o alis-hub-v3 .
      - name: Package
        run: |
          VERSION=${{ github.ref_name }}
          mkdir -p AlisHub-linux
          cp alis-hub-v3 AlisHub-linux/
          cp "${{ needs.flavor.outputs.is_beta == 'true' && 'build/appicon-beta.png' || 'build/appicon.png' }}" AlisHub-linux/alishub.png
          tar czf "AlisHub-linux-${VERSION}.tar.gz" AlisHub-linux
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: AlisHub-linux-*.tar.gz

  build-windows:
    needs: flavor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Install frontend deps
        run: cd frontend && npm install
      - name: Generate bindings
        # -ts must match build/Taskfile.yml and the bindings checked into
        # frontend/bindings. Without it wails emits .js with JSDoc types, which
        # tsc widens (map values become {} instead of string) and the frontend
        # build fails on code that typechecks fine locally.
        run: wails3 generate bindings -clean=true -ts
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Generate Windows resources (amd64)
        run: wails3 generate syso -arch amd64 -icon ${{ needs.flavor.outputs.ico }} -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_amd64.syso
      - name: Build binary (amd64)
        run: go build -tags production -trimpath -ldflags="-w -s -H windowsgui -X main.version=${{ github.ref_name }}" -o alis-hub-v3-amd64.exe .
        env:
          GOARCH: amd64
      - name: Generate Windows resources (arm64)
        run: wails3 generate syso -arch arm64 -icon ${{ needs.flavor.outputs.ico }} -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_arm64.syso
      - name: Build binary (arm64)
        run: go build -tags production -trimpath -ldflags="-w -s -H windowsgui -X main.version=${{ github.ref_name }}" -o alis-hub-v3-arm64.exe .
        env:
          GOARCH: arm64
      - name: Generate WebView2 bootstrapper
        run: wails3 generate webview2bootstrapper -dir build/windows/nsis
      - name: Build NSIS installer (amd64 + arm64)
        shell: pwsh
        run: |
          # project.nsi builds VIProductVersion as "$version.0", and NSIS requires
          # a strictly numeric X.X.X.X, so a -beta.N suffix has to be stripped here
          # or makensis aborts. The installer filename below keeps the full tag.
          $version = "${{ github.ref_name }}".TrimStart('v').Split('-')[0]
          $amd64Path = (Resolve-Path "alis-hub-v3-amd64.exe").Path
          $arm64Path = (Resolve-Path "alis-hub-v3-arm64.exe").Path
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          # Beta installs to its own directory under its own uninstall entry,
          # ships a differently named exe so the installer's taskkill cannot
          # terminate a running stable, and claims its own deep-link protocol.
          $productName = "${{ needs.flavor.outputs.app_name }}"
          $exeName     = "${{ needs.flavor.outputs.exe_name }}"
          $protocol    = "${{ needs.flavor.outputs.url_scheme }}"
          & makensis "-DARG_WAILS_AMD64_BINARY=$amd64Path" "-DARG_WAILS_ARM64_BINARY=$arm64Path" `
            "-DINFO_PRODUCTVERSION=$version" "-DINFO_PRODUCTNAME=$productName" `
            "-DPRODUCT_EXECUTABLE=$exeName" "-DCUSTOM_PROTOCOL=$protocol" `
            build/windows/nsis/project.nsi
      - name: Rename installer
        shell: pwsh
        run: Move-Item "bin/alis-hub-v3-amd64_arm64-installer.exe" "AlisHub-windows-${{ github.ref_name }}-installer.exe"
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: AlisHub-windows-*-installer.exe

  release:
    needs: [flavor, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AlisHub-macOS-*.zip
            AlisHub-macOS-*.dmg
            AlisHub-linux-*.tar.gz
            AlisHub-windows-*-installer.exe
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          # A tag with a semver prerelease suffix (v0.15.0-beta.1) ships to the
          # beta channel only. GitHub's /releases/latest excludes prereleases,
          # which is what keeps stable users from ever seeing these.
          prerelease: ${{ needs.flavor.outputs.prerelease }}

message Billing {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    FIXED = 1;
    HOURLY = 2;
    DELIVERABLE_BASED = 3;
    INSTALLMENT_BASED = 4;
  }
  enum ProgressStatus {
    PROGRESS_STATUS_UNSPECIFIED = 0;
    NOT_STARTED = 1;
    IN_PROGRESS = 2;
    COMPLETED = 3;
  }
  enum PaymentStatus {
    PAYMENT_STATUS_UNSPECIFIED = 0;
    INVOICED = 1;
    PAID = 2;
    READY_FOR_INVOICING = 3;
  }
  message FixedFee {
    .google.type.Money fee = 1;
    .google.protobuf.DoubleValue discount = 2;
    .alis.os.solutions.v2.Billing.ProgressStatus progress_status = 3;
    .alis.os.solutions.v2.Billing.PaymentStatus payment_status = 4;
    string invoice = 5;
  }
  message HourlyRate {
    message Sprint {
      .alis.os.solutions.v2.Billing.ProgressStatus progress_status = 1;
      .alis.os.solutions.v2.Billing.PaymentStatus payment_status = 2;
      string invoice = 3;
      .google.protobuf.Duration time_logged = 4;
      string description = 5;
      .google.type.Date start_date = 6;
      .google.type.Date end_date = 7;
      .google.type.Money amount = 8;
    }
    .google.type.Money hourly_rate = 1;
    .google.protobuf.DoubleValue discount = 2;
    .google.type.Money budget_cap = 3;
    repeated .alis.os.solutions.v2.Billing.HourlyRate.Sprint sprints = 4;
  }
  message DeliverableBased {
    message Deliverable {
      string title = 1;
      string description = 2;
      .alis.os.solutions.v2.Billing.ProgressStatus progress_status = 3;
      .alis.os.solutions.v2.Billing.PaymentStatus payment_status = 4;
      .google.type.Date date = 5;
      .google.type.Money fixed_fee = 6;
      .alis.os.solutions.v2.ElectronicSignature e_signature = 7;
      string invoice = 8;
    }
  }
  message InstallmentBased {
    message Installment {
      string title = 1;
      .google.type.Money amount = 2;
      .google.type.Date due_date = 3;
      string description = 4;
      .alis.os.solutions.v2.Billing.PaymentStatus payment_status = 5;
      string invoice = 6;
    }
    .google.type.Money full_amount = 1;
    .google.protobuf.DoubleValue discount = 2;
    .alis.os.solutions.v2.Billing.ProgressStatus progress_status = 3;
    repeated .alis.os.solutions.v2.Billing.InstallmentBased.Installment installments = 5;
  }
  string name = 1;
  string summary = 2;
  string vendor_account = 3;
  string client_account = 4;
  bool bill_through_alis = 5;
  .alis.os.solutions.v2.Billing.Type type = 6;
  string etag = 98;
  .google.protobuf.Timestamp update_time = 99;
  oneof option {
    .alis.os.solutions.v2.Billing.FixedFee fixed_fee = 7;
    .alis.os.solutions.v2.Billing.HourlyRate hourly_rate = 8;
    .alis.os.solutions.v2.Billing.DeliverableBased deliverable_based = 9;
    .alis.os.solutions.v2.Billing.InstallmentBased installment_based = 10;
  }
}


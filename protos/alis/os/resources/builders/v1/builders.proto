syntax = "proto3";

package alis.os.resources.builders.v1;

option go_package = "alis-hub-v3/gen/go/alis/os/resources/builders/v1;buildersv1pb";

import "alis/os/resources/products/v1/products.proto";
import "alis/os/services/dbd/v1/dbd.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

message Builder {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    MASTER = 1;
  }
  message CalendarUri {
    enum CalendarType {
      CALENDAR_TYPE_UNSPECIFIED = 0;
      GOOGLE_APPOINTMENT_SCHEDULE = 1;
    }
    string description = 1;
    string uri = 2;
    .alis.os.resources.builders.v1.Builder.CalendarUri.CalendarType calendar_type = 3;
  }
  message Activity {
    enum State {
      STATE_UNSPECIFIED = 0;
      SUCCEEDED = 1;
      FAILED = 2;
    }
    string description = 1;
    .alis.os.resources.builders.v1.Builder.Activity.State state = 2;
    .google.protobuf.Timestamp create_time = 3;
  }
  string name = 1;
  string given_name = 2;
  string family_name = 3;
  string primary_email = 4;
  repeated string build_partners = 5;
  repeated .alis.os.resources.builders.v1.Builder.CalendarUri calendar_uris = 6;
  string organisation = 7;
  repeated .alis.os.resources.builders.v1.Builder.Activity activities = 8;
  uint64 whatsapp = 9;
  string position = 10;
  string education = 11;
  string linkedin_uri = 12;
  string account = 13;
  string profile_picture = 14;
  .google.protobuf.Timestamp create_time = 99;
}

message SignupBuilderRequest {
  string given_name = 1;
  string family_name = 2;
  string secondary_email = 3;
  string primary_email_prefix = 4;
}

message SignupBuilderResponse {
  .alis.os.resources.builders.v1.Builder builder = 1;
}

message SendBuilderWelcomeEmailRequest {
  string given_name = 1;
  string family_name = 2;
  string temporary_password = 3;
  string secondary_email = 4;
}

message SendBuilderWelcomeEmailResponse {
}

message CreateBuilderRequest {
  .alis.os.resources.builders.v1.Builder builder = 1;
  string builder_id = 2;
}

message GetBuilderRequest {
  string name = 1;
  .google.protobuf.FieldMask read_mask = 2;
}

message UpdateBuilderRequest {
  .alis.os.resources.builders.v1.Builder builder = 1;
  .google.protobuf.FieldMask update_mask = 2;
}

message DeleteBuilderRequest {
  string name = 1;
}

message ListBuildersRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  .google.protobuf.FieldMask read_mask = 4;
}

message ListBuildersResponse {
  repeated .alis.os.resources.builders.v1.Builder builders = 1;
  string next_page_token = 2;
}

message BatchGetBuildersRequest {
  repeated string names = 1;
  .google.protobuf.FieldMask read_mask = 2;
}

message BatchGetBuildersResponse {
  repeated .alis.os.resources.builders.v1.Builder builders = 1;
}

message LookupBuilderRequest {
  string search_text = 1;
}

message LookupBuilderResponse {
  message Result {
    string builder = 1;
    string display_name = 2;
    string masked_email = 3;
  }
  repeated .alis.os.resources.builders.v1.LookupBuilderResponse.Result results = 1;
}

message RetrieveMaskedBuilderRequest {
  string builder = 1;
}

message RetrieveMaskedBuilderResponse {
  .alis.os.resources.builders.v1.MaskedBuilder masked_builder = 1;
}

message BatchRetrieveMaskedBuildersRequest {
  repeated string builders = 1;
}

message BatchRetrieveMaskedBuildersResponse {
  repeated .alis.os.resources.builders.v1.MaskedBuilder masked_builders = 1;
}

message MaskedBuilder {
  string builder = 1;
  string display_name = 2;
  string masked_email = 3;
  string profile_picture = 4;
}

message BuilderConfig {
  string name = 1;
  .google.protobuf.Timestamp update_time = 2;
  repeated string favourite_products = 3;
  repeated string favourite_services = 4;
  repeated string favourite_methods = 5;
  .google.protobuf.Timestamp notifications_last_opened = 6;
}

message GetBuilderConfigRequest {
  string name = 1;
  .google.protobuf.FieldMask read_mask = 2;
}

message UpdateBuilderConfigRequest {
  .alis.os.resources.builders.v1.BuilderConfig builder_config = 1;
  .google.protobuf.FieldMask update_mask = 2;
}

message SetNotificationsLastOpenedRequest {
  .google.protobuf.Timestamp notifications_last_opened = 1;
}

message SetNotificationsLastOpenedResponse {
  .alis.os.resources.builders.v1.BuilderConfig builder_config = 1;
}

message Notification {
  enum State {
    STATE_UNSPECIFIED = 0;
    INFO = 1;
    WARNING = 2;
    ERROR = 3;
    RUNNING = 4;
    SUCCESS = 5;
    ACTION_REQUIRED = 6;
  }
  enum Type {
    TYPE_UNSPECIFIED = 0;
    KICKSTARTER = 1;
    DEFINE = 2;
    BUILD = 3;
    DEPLOY = 4;
    REQUEST_IAM_POLICY_CHANGE = 5;
    IAM_POLICY_CHANGE_APPROVED = 6;
    IAM_POLICY_CHANGE_REJECTED = 7;
    IAM_POLICY_CHANGE_MADE = 8;
    SUPPORT_CASE_ASSIGNMENT = 9;
    SUPPORT_CASE_ACTION_REQUIRED = 10;
    SUPPORT_CASE_STATE_CHANGE = 11;
    DELETE_NEURON = 12;
    PLAN_DESTROY_NEURON = 13;
    DELETE_DEPLOYMENT = 14;
    DELETE_PRODUCT = 15;
    DELETE_ORGANISATION = 16;
    CREATE_PRODUCT = 17;
    CREATE_ORGANISATION = 18;
    CREATE_DEPLOYMENT = 19;
    TOGGLE_LOAD_BALANCER = 20;
    BILLING_ACCOUNT_UPDATE = 21;
    ALERT_INCIDENT = 22;
    SOLUTION_PROPOSAL_SIGNED = 23;
    SOLUTION_PROGRESS_UPDATE_COMMENT = 24;
    BLOCK_CREATE = 25;
    BLOCK_INSTALL = 26;
    BLOCK_UPGRADE = 27;
    BLOCK_UNINSTALL = 28;
    BLOCK_VERSION_CREATE = 29;
  }
  message DeleteDeployment {
    string deployment_display_name = 1;
    string deployment_google_project_id = 2;
    .alis.os.resources.builders.v1.MaskedBuilder deleted_by = 3;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 4;
  }
  message DeleteProduct {
    string product_display_name = 1;
    .alis.os.resources.builders.v1.MaskedBuilder deleted_by = 2;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 3;
  }
  message DeleteOrganisation {
    string organisation_display_name = 1;
    .alis.os.resources.builders.v1.MaskedBuilder deleted_by = 2;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 3;
  }
  message CreateProduct {
    string product_display_name = 1;
    .alis.os.resources.builders.v1.MaskedBuilder created_by = 2;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 3;
  }
  message CreateOrganisation {
    string organisation_display_name = 1;
    string organisation_domain = 2;
    .alis.os.resources.builders.v1.MaskedBuilder created_by = 3;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 4;
  }
  message CreateDeployment {
    string deployment_display_name = 1;
    string deployment_google_project_id = 2;
    .alis.os.resources.builders.v1.MaskedBuilder created_by = 3;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 4;
  }
  message ToggleLoadBalancer {
    string organisation_display_name = 1;
    string organisation_domain = 2;
    .alis.os.resources.builders.v1.MaskedBuilder actioned_by = 3;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 4;
  }
  message BillingAccountUpdate {
    string resource_display_name = 1;
    string actioned_by = 2;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 3;
  }
  message Step {
    enum State {
      STATE_UNSPECIFIED = 0;
      PLANNED = 1;
      BUSY = 2;
      CRITICAL_FAILURE = 3;
      SUCCEEDED = 4;
      NON_CRITICAL_FAILURE = 5;
      SKIPPED = 6;
    }
    string display_name = 1;
    string description = 2;
    .alis.os.resources.builders.v1.Notification.Step.State state = 3;
    string result = 4;
    string id = 5;
  }
  message Kickstarter {
    message Step {
      enum State {
        STATE_UNSPECIFIED = 0;
        PENDING = 1;
        RUNNING = 2;
        SUCCEEDED = 3;
        FAILED = 4;
      }
      .alis.os.resources.builders.v1.Notification.Kickstarter.Step.State state = 1;
      string notes = 2;
    }
    repeated .alis.os.resources.builders.v1.Notification.Kickstarter.Step steps = 1;
  }
  message Define {
    string commit_sha = 1;
    repeated .alis.os.services.dbd.v1.DefineBuildDeployProgress progress = 3;
  }
  message Build {
    string version = 1;
    string commit_sha = 2;
    string define_commit_sha = 3;
    repeated string dockerfile_paths_built = 4;
    repeated string dockerfile_paths_retagged = 5;
    string cloud_build_uri = 7;
    repeated .alis.os.services.dbd.v1.DefineBuildDeployProgress progress = 8;
  }
  message Deploy {
    string product_deployment_display_name = 1;
    string product_deployment_gcp_id = 2;
    repeated .alis.os.services.dbd.v1.DefineBuildDeployProgress progress = 4;
    string version = 5;
    string cloud_build_uri = 6;
  }
  message DeleteNeuron {
    repeated .alis.os.resources.products.v1.DeleteNeuronMetadata.DeleteNeuronProgress progress = 1;
    string cloud_build_uri = 2;
  }
  message PlanDestroyNeuron {
    string cloud_build_uri = 1;
  }
  message RequestIamPolicyChange {
    string iam_policy_change = 1;
    string requester_display_name = 2;
    string role = 3;
    string principal_display_name = 4;
    string resource_display_name = 5;
    string resource_identifier = 6;
  }
  message IamPolicyChangeApproved {
    string iam_policy_change = 1;
    string requester_display_name = 2;
    string role = 3;
    string principal_display_name = 4;
    string resource_display_name = 5;
    string resource_identifier = 6;
    string applier_display_name = 7;
    string applier_notes = 8;
  }
  message IamPolicyChangeRejected {
    string iam_policy_change = 1;
    string requester_display_name = 2;
    string role = 3;
    string principal_display_name = 4;
    string resource_display_name = 5;
    string resource_identifier = 6;
    string applier_display_name = 7;
    string applier_notes = 8;
  }
  message IamPolicyChangeMade {
    string iam_policy_change = 1;
    string role = 2;
    string principal_display_name = 3;
    string resource_display_name = 4;
    string resource_identifier = 5;
    string applier_display_name = 6;
    string applier_notes = 7;
  }
  message SupportCaseAssignment {
    string support_case = 1;
    string description = 2;
  }
  message SupportCaseActionRequired {
    string support_case = 1;
    string description = 2;
  }
  message SupportCaseStateChange {
    string support_case = 1;
    string old_state = 2;
    string new_state = 3;
  }
  message AlertIncident {
    string incident = 1;
    string description = 2;
    string uri = 3;
    string summary = 4;
    string state = 5;
    string resource_type_display_name = 7;

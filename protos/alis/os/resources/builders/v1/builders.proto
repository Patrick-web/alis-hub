    string branch = 2;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 5;
  }
  message BlockUpgrade {
    string block_display_name = 1;
    string branch = 2;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 5;
  }
  message BlockUninstall {
    string block_display_name = 1;
    string branch = 2;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 5;
  }
  message BlockVersionCreate {
    string block_display_name = 1;
    repeated .alis.os.resources.builders.v1.Notification.Step steps = 5;
  }
  string name = 1;
  string title = 2;
  string subtitle = 3;
  .alis.os.resources.builders.v1.Notification.State state = 4;
  string proto_package = 5;
  string operation = 6;
  .alis.os.resources.builders.v1.Notification.Type type = 7;
  .google.protobuf.Timestamp create_time = 98;
  .google.protobuf.Timestamp update_time = 99;
  oneof body {
    .alis.os.resources.builders.v1.Notification.Kickstarter kickstarter = 10;
    .alis.os.resources.builders.v1.Notification.Define define = 11;
    .alis.os.resources.builders.v1.Notification.Build build = 12;
    .alis.os.resources.builders.v1.Notification.Deploy deploy = 13;
    .alis.os.resources.builders.v1.Notification.RequestIamPolicyChange request_iam_policy_change = 14;
    .alis.os.resources.builders.v1.Notification.IamPolicyChangeApproved iam_policy_change_approved = 15;
    .alis.os.resources.builders.v1.Notification.IamPolicyChangeRejected iam_policy_change_rejected = 16;
    .alis.os.resources.builders.v1.Notification.IamPolicyChangeMade iam_policy_change_made = 17;
    .alis.os.resources.builders.v1.Notification.SupportCaseAssignment support_case_assignment = 18;
    .alis.os.resources.builders.v1.Notification.SupportCaseActionRequired support_case_action_required = 19;
    .alis.os.resources.builders.v1.Notification.SupportCaseStateChange support_case_state_change = 20;
    .alis.os.resources.builders.v1.Notification.DeleteNeuron delete_neuron = 21;
    .alis.os.resources.builders.v1.Notification.PlanDestroyNeuron plan_destroy_neuron = 22;
    .alis.os.resources.builders.v1.Notification.DeleteDeployment delete_deployment = 23;
    .alis.os.resources.builders.v1.Notification.DeleteProduct delete_product = 24;
    .alis.os.resources.builders.v1.Notification.DeleteOrganisation delete_organisation = 25;
    .alis.os.resources.builders.v1.Notification.CreateProduct create_product = 26;
    .alis.os.resources.builders.v1.Notification.CreateOrganisation create_organisation = 27;
    .alis.os.resources.builders.v1.Notification.CreateDeployment create_deployment = 28;
    .alis.os.resources.builders.v1.Notification.ToggleLoadBalancer toggle_load_balancer = 29;
    .alis.os.resources.builders.v1.Notification.BillingAccountUpdate billing_account_update = 30;
    .alis.os.resources.builders.v1.Notification.AlertIncident alert_incident = 31;
    .alis.os.resources.builders.v1.Notification.SolutionProposalSigned solution_proposal_signed = 32;
    .alis.os.resources.builders.v1.Notification.SolutionProgressUpdateComment solution_progress_update_comment = 33;
    .alis.os.resources.builders.v1.Notification.BlockCreate block_create = 34;
    .alis.os.resources.builders.v1.Notification.BlockInstall block_install = 35;
    .alis.os.resources.builders.v1.Notification.BlockUpgrade block_upgrade = 36;
    .alis.os.resources.builders.v1.Notification.BlockUninstall block_uninstall = 37;
    .alis.os.resources.builders.v1.Notification.BlockVersionCreate block_version_create = 38;
  }
}

message GetNotificationRequest {
  string name = 1;
  .google.protobuf.FieldMask read_mask = 2;
}

message CreateNotificationRequest {
  string parent = 1;
  .alis.os.resources.builders.v1.Notification notification = 2;
}

message UpdateNotificationRequest {
  .alis.os.resources.builders.v1.Notification notification = 1;
  .google.protobuf.FieldMask update_mask = 2;
}

message DeleteNotificationRequest {
  string name = 1;
}

message ListNotificationsRequest {
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  .google.protobuf.FieldMask read_mask = 4;
}

message ListNotificationsResponse {
  repeated .alis.os.resources.builders.v1.Notification notifications = 1;
  string next_page_token = 2;
  .google.protobuf.FieldMask read_mask = 3;
}

service BuildersService {
  rpc SignupBuilder(.alis.os.resources.builders.v1.SignupBuilderRequest) returns (.alis.os.resources.builders.v1.SignupBuilderResponse);
  rpc SendBuilderWelcomeEmail(.alis.os.resources.builders.v1.SendBuilderWelcomeEmailRequest) returns (.alis.os.resources.builders.v1.SendBuilderWelcomeEmailResponse);
  rpc CreateBuilder(.alis.os.resources.builders.v1.CreateBuilderRequest) returns (.alis.os.resources.builders.v1.Builder);
  rpc GetBuilder(.alis.os.resources.builders.v1.GetBuilderRequest) returns (.alis.os.resources.builders.v1.Builder);
  rpc UpdateBuilder(.alis.os.resources.builders.v1.UpdateBuilderRequest) returns (.alis.os.resources.builders.v1.Builder);
  rpc DeleteBuilder(.alis.os.resources.builders.v1.DeleteBuilderRequest) returns (.google.protobuf.Empty);
  rpc ListBuilders(.alis.os.resources.builders.v1.ListBuildersRequest) returns (.alis.os.resources.builders.v1.ListBuildersResponse);
  rpc BatchGetBuilders(.alis.os.resources.builders.v1.BatchGetBuildersRequest) returns (.alis.os.resources.builders.v1.BatchGetBuildersResponse);
  rpc LookupBuilder(.alis.os.resources.builders.v1.LookupBuilderRequest) returns (.alis.os.resources.builders.v1.LookupBuilderResponse);
  rpc RetrieveMaskedBuilder(.alis.os.resources.builders.v1.RetrieveMaskedBuilderRequest) returns (.alis.os.resources.builders.v1.RetrieveMaskedBuilderResponse);
  rpc BatchRetrieveMaskedBuilders(.alis.os.resources.builders.v1.BatchRetrieveMaskedBuildersRequest) returns (.alis.os.resources.builders.v1.BatchRetrieveMaskedBuildersResponse);
  rpc GetBuilderConfig(.alis.os.resources.builders.v1.GetBuilderConfigRequest) returns (.alis.os.resources.builders.v1.BuilderConfig);
  rpc UpdateBuilderConfig(.alis.os.resources.builders.v1.UpdateBuilderConfigRequest) returns (.alis.os.resources.builders.v1.BuilderConfig);
  rpc SetNotificationsLastOpened(.alis.os.resources.builders.v1.SetNotificationsLastOpenedRequest) returns (.alis.os.resources.builders.v1.SetNotificationsLastOpenedResponse);
  rpc GetNotification(.alis.os.resources.builders.v1.GetNotificationRequest) returns (.alis.os.resources.builders.v1.Notification);
  rpc CreateNotification(.alis.os.resources.builders.v1.CreateNotificationRequest) returns (.alis.os.resources.builders.v1.Notification);
  rpc UpdateNotification(.alis.os.resources.builders.v1.UpdateNotificationRequest) returns (.alis.os.resources.builders.v1.Notification);
  rpc DeleteNotification(.alis.os.resources.builders.v1.DeleteNotificationRequest) returns (.google.protobuf.Empty);
  rpc ListNotifications(.alis.os.resources.builders.v1.ListNotificationsRequest) returns (.alis.os.resources.builders.v1.ListNotificationsResponse);
}

}

message GenerateCommonProtosRequest {
  .alis.os.vscode.v2.WorkspaceContext workspace = 1;
}

message GenerateCommonProtosResponse {
  message File {
    string name = 1;
    bytes content = 2;
  }
  repeated .alis.os.vscode.v2.GenerateCommonProtosResponse.File files = 1;
}

service BuildKitService {
  rpc RetrieveBuildKit(.alis.os.vscode.v2.RetrieveBuildKitRequest) returns (.alis.os.vscode.v2.RetrieveBuildKitResponse);
}

service VscodeService {
  rpc GenerateProductWorkspaceListOverview(.alis.os.vscode.v2.GenerateProductWorkspaceListOverviewRequest) returns (.alis.os.vscode.v2.GenerateProductWorkspaceListOverviewResponse);
  rpc GeneratePackageScripts(.alis.os.vscode.v2.GeneratePackageScriptsRequest) returns (.alis.os.vscode.v2.GeneratePackageScriptsResponse);
  rpc GenerateBuildScripts(.alis.os.vscode.v2.GenerateBuildScriptsRequest) returns (.alis.os.vscode.v2.GenerateBuildScriptsResponse);
  rpc GenerateConfigurations(.alis.os.vscode.v2.GenerateConfigurationsRequest) returns (.alis.os.vscode.v2.GenerateConfigurationsResponse);
  rpc GenerateLanguagePackageConfigs(.alis.os.vscode.v2.GenerateLanguagePackageConfigsRequest) returns (.alis.os.vscode.v2.GenerateLanguagePackageConfigsResponse);
  rpc GenerateCommonProtos(.alis.os.vscode.v2.GenerateCommonProtosRequest) returns (.alis.os.vscode.v2.GenerateCommonProtosResponse);
  rpc GenerateContext(.alis.os.vscode.v2.GenerateContextRequest) returns (.alis.os.vscode.v2.GenerateContextResponse);
  rpc GeneratePlayground(.alis.os.vscode.v2.GeneratePlaygroundRequest) returns (.alis.os.vscode.v2.GeneratePlaygroundResponse);
  rpc GenerateGeminiConfigs(.alis.os.vscode.v2.GenerateGeminiConfigsRequest) returns (.alis.os.vscode.v2.GenerateGeminiConfigsResponse);
  rpc GenerateCodexConfigs(.alis.os.vscode.v2.GenerateCodexConfigsRequest) returns (.alis.os.vscode.v2.GenerateCodexConfigsResponse);
  rpc GenerateClaudeConfigs(.alis.os.vscode.v2.GenerateClaudeConfigsRequest) returns (.alis.os.vscode.v2.GenerateClaudeConfigsResponse);
  rpc GenerateBuildSpec(.alis.os.vscode.v2.GenerateBuildSpecRequest) returns (.alis.os.vscode.v2.GenerateBuildSpecResponse);
  rpc RetrievePackageCodeblockInstances(.alis.os.vscode.v2.RetrievePackageCodeblockInstancesRequest) returns (.alis.os.vscode.v2.RetrievePackageCodeblockInstancesResponse);
  rpc RetrieveProductNpmHosts(.alis.os.vscode.v2.RetrieveProductNpmHostsRequest) returns (.alis.os.vscode.v2.RetrieveProductNpmHostsResponse);
  rpc GenerateSshKeys(.alis.os.vscode.v2.GenerateSshKeysRequest) returns (.alis.os.vscode.v2.GenerateSshKeysResponse);
  rpc MergeSshConfig(.alis.os.vscode.v2.MergeSshConfigRequest) returns (.alis.os.vscode.v2.MergeSshConfigResponse);
  rpc GetWorkstationProvisionOperation(.alis.os.vscode.v2.GetWorkstationProvisionOperationRequest) returns (.alis.os.vscode.v2.GetWorkstationProvisionOperationResponse);
}

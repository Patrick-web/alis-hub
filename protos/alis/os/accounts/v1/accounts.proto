  repeated .alis.os.accounts.v1.Invoice.MeterInstances deleted_meter_instances = 41;
  repeated string unallocated_seats = 42;
  .google.protobuf.Timestamp create_time = 98;
  .google.protobuf.Timestamp update_time = 99;

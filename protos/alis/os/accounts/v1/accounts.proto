  string name = 1;
  string number = 2;
  repeated .alis.os.accounts.v1.Invoice.LineItem line_items = 3;
  .google.type.Money subtotal = 4;
  .google.type.Money vat_total = 5;
  .google.type.Money total = 6;
  .google.type.Money total_due = 7;
